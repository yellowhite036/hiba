- name: Ensure destination directory exists
  ansible.builtin.file:
    path: "{{ remote_destination_dir }}"
    state: directory
    mode: '0755'

- name: Ensure log directory exists
  ansible.builtin.file:
    path: "{{ remote_destination_dir }}/logs"
    state: directory
    mode: '0755'

- name: Start the HiBA service in the background
  ansible.builtin.shell:
    chdir: "{{ remote_destination_dir }}"
    cmd: |
      nohup /usr/jvm/jdk-21.0.2/bin/java \
        -DLOG_LEVEL={{ log_level }} \
        -DTPM_LOG_LEVEL={{ tpm_log_level }} \
        -jar {{ jar_name }} \
        > {{ startup_log_path }} 2>&1 & \
      echo $! > {{ pid_path }}
  changed_when: false