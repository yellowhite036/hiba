[hiba_service:vars]
ansible_python_interpreter = /usr/bin/python3

[hiba_service]
# 為每個 port 設定一個唯一的別名
# ansible_host 指定 IP 位址
# ansible_port 指定該主機的 SSH 連接埠
# ansible_user 指定登入的使用者名稱
accounting-server ansible_host=192.168.1.222 ansible_port=22 ansible_user=user
node1 ansible_host=192.168.1.245 ansible_port=22 ansible_user=user
node2 ansible_host=192.168.1.171 ansible_port=22 ansible_user=user
node3 ansible_host=192.168.2.56 ansible_port=22 ansible_user=user
node4 ansible_host=192.168.2.57 ansible_port=22 ansible_user=user
node5 ansible_host=192.168.2.58 ansible_port=22 ansible_user=user
node6 ansible_host=192.168.2.59 ansible_port=22 ansible_user=user
node7 ansible_host=192.168.3.60 ansible_port=22 ansible_user=user
node8 ansible_host=192.168.3.61 ansible_port=22 ansible_user=user
node9 ansible_host=192.168.3.62 ansible_port=22 ansible_user=user
node10 ansible_host=192.168.3.63 ansible_port=22 ansible_user=user